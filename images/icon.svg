<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 5-point sharp star -->
    <path id="star" d="M 0 -7 L 1.572 -2.163 L 6.657 -2.163 L 2.543 0.826 L 4.114 5.663 L 0 2.674 L -4.114 5.663 L -2.543 0.826 L -6.657 -2.163 L -1.572 -2.163 Z"/>

    <!-- bare hat silhouette: cone with razor tip curling up-right + wide brim -->
    <g id="hatSolid">
      <path d="M 8 176 C 8 158 62 146 132 146 C 202 146 256 158 256 176 C 256 196 202 208 132 208 C 62 208 8 196 8 176 Z"/>
      <path d="M 64 158 C 70 108 86 58 120 32 C 158 4 206 -6 250 8 C 226 22 214 34 210 52 C 202 90 190 124 184 158 Z"/>
    </g>

    <!-- full hat: silhouette (takes `color`) + white band + white stars -->
    <g id="hat">
      <use href="#hatSolid" fill="currentColor"/>
      <path fill="#FFFFFF" opacity="0.92" d="M 70 138 C 102 150 150 150 178 137 L 183 151 C 153 164 101 164 65 151 Z"/>
      <use href="#star" transform="translate(160 60) scale(1.15)" fill="#FFFFFF"/>
      <use href="#star" transform="translate(124 100) scale(0.95)" fill="#FFFFFF"/>
      <use href="#star" transform="translate(162 108) scale(0.9)"  fill="#FFFFFF"/>
      <use href="#star" transform="translate(132 138) scale(0.85)" fill="#FFFFFF"/>
      <use href="#star" transform="translate(178 146) scale(0.8)"  fill="#FFFFFF"/>
    </g>

    <!-- knockout: erase where the front hat (slightly enlarged) sits → transparent gap ring -->
    <mask id="frontCut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <use href="#hatSolid" transform="translate(233.4 236.8) scale(0.855)" fill="#000000"/>
    </mask>
  </defs>

  <!-- transparent background — two overlapping hats, WeChat two-bubble composition -->
  <!-- back hat: larger, upper-left, wizard purple; punched by the front hat's silhouette -->
  <use href="#hat" transform="translate(44 85) scale(1.3)" color="#6A45C8" mask="url(#frontCut)"/>
  <!-- front hat: smaller, lower-right, WeCom blue -->
  <use href="#hat" transform="translate(238 241) scale(0.82)" color="#2F7DF0"/>
</svg>
