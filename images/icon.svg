<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Claude terracotta → WeCom green: the bridge, expressed as color -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8825C"/>
      <stop offset="0.52" stop-color="#2FA285"/>
      <stop offset="1" stop-color="#07C160"/>
    </linearGradient>
    <linearGradient id="hat" x1="200" y1="70" x2="300" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF3F0"/>
    </linearGradient>
    <linearGradient id="band" x1="180" y1="300" x2="330" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0A07E"/>
      <stop offset="1" stop-color="#E8703F"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B3B2E" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#FFFFFF" opacity="0.05"/>

  <g filter="url(#soft)">
    <!-- wizard hat: curved floppy cone bending to the right, ending in a star tip -->
    <path d="M330 96
             C300 150 300 176 288 214
             L330 322
             C334 334 326 346 313 346
             L199 346
             C186 346 178 334 182 322
             L262 118
             C270 98 300 78 330 96 Z"
          fill="url(#hat)"/>

    <!-- hat brim: gently curved, hat-like -->
    <path d="M128 344
             C128 322 184 312 256 312
             C328 312 384 322 384 344
             C384 368 328 380 256 380
             C184 380 128 368 128 344 Z"
          fill="url(#hat)"/>
    <path d="M128 344 C128 358 184 372 256 372 C328 372 384 358 384 344
             C384 360 330 374 256 374 C182 374 128 360 128 344 Z"
          fill="#0B3B2E" opacity="0.06"/>

    <!-- hat band with buckle -->
    <path d="M196 296 L312 296 L322 330 L188 330 Z" fill="url(#band)"/>
    <rect x="242" y="300" width="26" height="24" rx="5" fill="#FBE3B0"/>
    <rect x="248" y="306" width="14" height="12" rx="3" fill="url(#band)"/>
  </g>

  <!-- star at the bent tip -->
  <path d="M330 78 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6 z" fill="#FFFFFF"/>

  <!-- magic sparkles floating off the hat -->
  <g fill="#FFFFFF">
    <path d="M230 168 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6 z" opacity="0.95"/>
    <path d="M296 236 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" opacity="0.85"/>
  </g>

  <!-- orbiting spark dots hinting at the WS bridge -->
  <circle cx="398" cy="150" r="9" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="116" cy="196" r="7" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="410" cy="366" r="6" fill="#FFFFFF" opacity="0.6"/>
</svg>
