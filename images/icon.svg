<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- WeCom-blue night sky: bright blue top-left → deep indigo bottom -->
    <linearGradient id="bg" x1="80" y1="24" x2="440" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F73E8"/>
      <stop offset="0.5" stop-color="#1B4BB5"/>
      <stop offset="1" stop-color="#0A2160"/>
    </linearGradient>
    <!-- nebula glow -->
    <radialGradient id="nebula" cx="0.74" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#7FC8FF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#7FC8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="0.2" cy="0.82" r="0.6">
      <stop offset="0" stop-color="#6E4BFF" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#6E4BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hat" x1="180" y1="72" x2="320" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7E3F7"/>
    </linearGradient>
    <linearGradient id="hatShade" x1="256" y1="120" x2="256" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FA9D6" stop-opacity="0"/>
      <stop offset="1" stop-color="#7E97CC" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="brim" x1="120" y1="330" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C6D5EE"/>
    </linearGradient>
    <linearGradient id="band" x1="184" y1="292" x2="326" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2A985"/>
      <stop offset="1" stop-color="#E56A34"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#030F3A" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app-icon rounded square + night sky -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#nebula)"/>
  <rect width="512" height="512" rx="114" fill="url(#nebula2)"/>

  <!-- starfield: scattered dots of varying size/opacity, kept clear of the hat -->
  <g fill="#FFFFFF">
    <circle cx="72"  cy="86"  r="2.4" opacity="0.9"/>
    <circle cx="140" cy="58"  r="1.6" opacity="0.7"/>
    <circle cx="196" cy="92"  r="1.3" opacity="0.6"/>
    <circle cx="96"  cy="150" r="1.8" opacity="0.75"/>
    <circle cx="58"  cy="232" r="2.2" opacity="0.85"/>
    <circle cx="120" cy="270" r="1.4" opacity="0.6"/>
    <circle cx="72"  cy="330" r="1.9" opacity="0.8"/>
    <circle cx="110" cy="404" r="2.3" opacity="0.85"/>
    <circle cx="176" cy="436" r="1.5" opacity="0.65"/>
    <circle cx="250" cy="452" r="1.7" opacity="0.7"/>
    <circle cx="330" cy="440" r="1.4" opacity="0.6"/>
    <circle cx="400" cy="452" r="2.1" opacity="0.8"/>
    <circle cx="444" cy="392" r="1.6" opacity="0.7"/>
    <circle cx="454" cy="300" r="2.4" opacity="0.9"/>
    <circle cx="418" cy="238" r="1.4" opacity="0.6"/>
    <circle cx="452" cy="176" r="1.8" opacity="0.75"/>
    <circle cx="392" cy="110" r="1.5" opacity="0.65"/>
    <circle cx="330" cy="66"  r="2.0" opacity="0.8"/>
    <circle cx="270" cy="52"  r="1.4" opacity="0.6"/>
  </g>

  <!-- twinkles: little 4-point sparkles glowing in the sky -->
  <g fill="#FFFFFF">
    <circle cx="86"  cy="104" r="9" fill="url(#starGlow)" opacity="0.6"/>
    <path d="M86 92 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 z"/>
    <circle cx="432" cy="140" r="9" fill="url(#starGlow)" opacity="0.6"/>
    <path d="M432 128 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 z"/>
    <circle cx="150" cy="360" r="7" fill="url(#starGlow)" opacity="0.5"/>
    <path d="M150 351 l2.8 6.5 6.5 2.8 -6.5 2.8 -2.8 6.5 -2.8 -6.5 -6.5 -2.8 6.5 -2.8 z"/>
  </g>

  <g filter="url(#soft)">
    <!-- brim -->
    <path d="M116 342 C116 320 168 306 256 306 C344 306 396 320 396 342
             C396 366 344 384 256 384 C168 384 116 366 116 342 Z" fill="url(#brim)"/>

    <!-- cone: smooth S-curve, floppy tip curling right -->
    <path d="M338 92 C352 108 350 132 336 156 C318 188 300 214 302 246
             C303 268 314 296 322 314 C326 324 320 334 309 334 L203 334
             C192 334 186 324 190 314 L268 118 C278 92 316 70 338 92 Z" fill="url(#hat)"/>
    <path d="M338 92 C352 108 350 132 336 156 C318 188 300 214 302 246
             C303 268 314 296 322 314 C326 324 320 334 309 334 L203 334
             C192 334 186 324 190 314 L268 118 C278 92 316 70 338 92 Z" fill="url(#hatShade)"/>

    <!-- band + buckle, Claude terracotta = the Claude↔WeCom bridge accent -->
    <path d="M200 300 L312 300 L322 330 L190 330 Z" fill="url(#band)"/>
    <rect x="240" y="303" width="30" height="26" rx="6" fill="#FCE7B8"/>
    <rect x="247" y="309" width="16" height="14" rx="3.5" fill="#E56A34"/>

    <!-- brim front-edge highlight -->
    <path d="M150 356 C200 372 312 372 362 356 C312 380 200 380 150 356 Z"
          fill="#7E97CC" opacity="0.28"/>
  </g>

  <!-- star crowning the curling tip -->
  <circle cx="344" cy="80" r="16" fill="url(#starGlow)" opacity="0.7"/>
  <path d="M344 74 l6.5 18 18 6.5 -18 6.5 -6.5 18 -6.5 -18 -18 -6.5 18 -6.5 z" fill="#FFFFFF"/>

  <!-- sparkles rising off the hat -->
  <g fill="#FFFFFF">
    <path d="M232 176 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6 z" opacity="0.96"/>
    <path d="M298 244 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" opacity="0.85"/>
  </g>
</svg>
